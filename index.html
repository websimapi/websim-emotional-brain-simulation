<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotional Brain Simulation</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container">
        <div class="brain-container">
            <div class="brain-visualization">
                <!-- Brain visualization will be rendered here -->
                <svg id="brain-svg" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
                    <!-- Brain regions -->
                    <path id="brain-zeal" class="brain-region" d="M150,100 Q200,50 250,100 Q300,50 350,100 Q400,150 350,200 Q300,250 250,200 Q200,250 150,200 Q100,150 150,100" fill="#FFD700" opacity="0.5"/>
                    <path id="brain-gloom" class="brain-region" d="M150,120 Q200,70 250,120 Q300,70 350,120 Q390,160 350,210 Q300,260 250,210 Q200,260 150,210 Q110,160 150,120" fill="#0000CD" opacity="0.5"/>
                    <path id="brain-wrath" class="brain-region" d="M150,140 Q200,90 250,140 Q300,90 350,140 Q380,170 350,220 Q300,270 250,220 Q200,270 150,220 Q120,170 150,140" fill="#DC143C" opacity="0.5"/>
                    <path id="brain-skeptic" class="brain-region" d="M150,160 Q200,110 250,160 Q300,110 350,160 Q370,180 350,230 Q300,280 250,230 Q200,280 150,230 Q130,180 150,160" fill="#32CD32" opacity="0.5"/>
                    <path id="brain-jitters" class="brain-region" d="M150,180 Q200,130 250,180 Q300,130 350,180 Q360,190 350,240 Q300,290 250,240 Q200,290 150,240 Q140,190 150,180" fill="#8A2BE2" opacity="0.5"/>
                </svg>
            </div>
            <div class="player-status">
                <h2>Player Status</h2>
                <div class="status-bars">
                    <div class="status-item">
                        <label>Overall Mood:</label>
                        <div class="mood-indicator">Neutral</div>
                    </div>
                    <div class="status-item">
                        <label>Dominant Emotion:</label>
                        <div class="dominant-emotion">Balanced</div>
                    </div>
                    
                    <!-- Add cooldown indicator -->
                    <div class="cooldown-container">
                        <div class="cooldown-label">
                            <span>Next Brain Interaction:</span>
                            <span id="cooldown-remaining">0.0s</span>
                        </div>
                        <div class="cooldown-progress">
                            <div class="cooldown-bar" id="cooldown-bar"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="emotion-panel">
            <h2>Emotional Console</h2>
            <div class="emotion-tabs">
                <button class="tab-btn active" data-emotion="zeal">Zeal</button>
                <button class="tab-btn" data-emotion="gloom">Gloom</button>
                <button class="tab-btn" data-emotion="wrath">Wrath</button>
                <button class="tab-btn" data-emotion="skeptic">Skeptic</button>
                <button class="tab-btn" data-emotion="jitters">Jitters</button>
            </div>
            <div class="emotion-content">
                <div class="conversation-display" id="conversation-display">
                    <!-- Conversation will be displayed here -->
                </div>
                <div class="input-area">
                    <input type="text" id="emotion-input" placeholder="Talk to the current emotion...">
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </div>
        
        <div class="thought-bubble" id="thought-bubble">
            <div class="thought-content" id="thought-content">
                <!-- Emotion conversation will appear here -->
            </div>
        </div>
        
        <div class="thought-history">
            <h2>Thought History</h2>
            <div class="thought-history-panel" id="thought-history-panel">
                <!-- Thought history will appear here -->
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/models/brain.js"></script>
    <script src="js/models/player.js"></script>
    <script src="js/models/emotion.js"></script>
    <script src="js/controllers/brainController.js"></script>
    <script src="js/controllers/emotionController.js"></script>
    <script src="js/controllers/uiController.js"></script>
    <script src="js/services/conversationService.js"></script>
    <script src="js/main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
